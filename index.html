<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UKI PS Watchtower</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { 
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: #0d1117; color: #c9d1d9; min-height: 100vh;
  display: flex; flex-direction: column;
}
:root {
  --bg: #0d1117; --bg2: #161b22; --bg3: #21262d;
  --border: #30363d; --text: #c9d1d9; --text2: #8b949e;
  --green: #3fb950; --navy: #1f6feb; --red: #f85149;
  --orange: #d29922; --yellow: #e3b341;
}
header {
  background: linear-gradient(135deg, #0d1117 0%, #161b22 100%);
  border-bottom: 1px solid var(--border);
  padding: 16px 24px;
  display: flex; align-items: center; gap: 12px;
}
header h1 { font-size: 20px; color: #fff; }
header p { font-size: 13px; color: var(--text2); margin-left: auto; }
.layout {
  display: flex; flex: 1; height: calc(100vh - 57px);
  overflow: hidden;
}
.sidebar {
  width: 200px; min-width: 160px;
  background: var(--bg2); border-right: 1px solid var(--border);
  overflow-y: auto; padding: 12px 0;
}
.sidebar h3 {
  font-size: 11px; font-weight: 600; text-transform: uppercase;
  letter-spacing: 1px; color: var(--text2); padding: 8px 16px 4px;
}
.date-item {
  padding: 8px 16px; cursor: pointer; font-size: 13px;
  display: flex; justify-content: space-between; align-items: center;
  border-left: 3px solid transparent; transition: all 0.15s;
}
.date-item:hover { background: var(--bg3); }
.date-item.active { border-left-color: var(--navy); background: var(--bg3); color: #fff; }
.date-item .badge {
  background: var(--bg3); border-radius: 10px; padding: 2px 7px;
  font-size: 11px; color: var(--text2);
}
.date-item.active .badge { background: var(--navy); color: #fff; }
.main {
  flex: 1; overflow-y: auto; padding: 20px 24px;
}
.filter-row {
  display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px;
}
.chip {
  padding: 5px 14px; border-radius: 20px; font-size: 12px; font-weight: 600;
  cursor: pointer; border: 1px solid var(--border); background: var(--bg2);
  color: var(--text2); transition: all 0.15s; white-space: nowrap;
}
.chip:hover { border-color: var(--navy); color: var(--navy); }
.chip.active { background: var(--navy); border-color: var(--navy); color: #fff; }
.card {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 8px; padding: 16px 20px; margin-bottom: 14px;
  transition: border-color 0.15s;
}
.card:hover { border-color: var(--navy); }
.card-meta {
  display: flex; align-items: center; gap: 10px; margin-bottom: 10px;
}
.company-tag {
  font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px;
  padding: 3px 10px; border-radius: 4px;
}
.date-tag { font-size: 12px; color: var(--text2); }
.sentiment-dot {
  width: 8px; height: 8px; border-radius: 50%; margin-left: auto;
}
.card h3 { font-size: 15px; color: #fff; margin-bottom: 8px; line-height: 1.5; }
.card p { font-size: 13px; color: var(--text2); line-height: 1.6; margin-bottom: 10px; }
.card a {
  font-size: 12px; color: var(--green); text-decoration: none;
  display: inline-flex; align-items: center; gap: 4px;
}
.card a:hover { text-decoration: underline; }
.right-panel {
  width: 240px; min-width: 200px;
  background: var(--bg2); border-left: 1px solid var(--border);
  overflow-y: auto; padding: 16px;
}
.right-panel h3 {
  font-size: 11px; font-weight: 600; text-transform: uppercase;
  letter-spacing: 1px; color: var(--text2); margin-bottom: 16px;
}
.sentiment-row {
  margin-bottom: 14px;
}
.sentiment-row .co {
  font-size: 13px; font-weight: 600; color: var(--text);
  margin-bottom: 6px; display: flex; justify-content: space-between;
}
.bar-bg {
  height: 6px; background: var(--bg3); border-radius: 3px; overflow: hidden;
}
.bar-fill {
  height: 100%; border-radius: 3px; transition: width 0.3s;
}
.bar-pos { background: var(--green); }
.bar-neu { background: var(--yellow); }
.bar-neg { background: var(--red); }
.sent-meta { font-size: 11px; color: var(--text2); margin-top: 4px; }
.no-results {
  text-align: center; padding: 60px 20px; color: var(--text2);
}
/* Chat widget */
#chat-btn {
  position: fixed; bottom: 28px; right: 28px; z-index: 1000;
  width: 52px; height: 52px; border-radius: 50%;
  background: linear-gradient(135deg, #1f6feb, #0d6e4f);
  border: none; cursor: pointer; box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  font-size: 22px; display: flex; align-items: center; justify-content: center;
  transition: transform 0.2s;
}
#chat-btn:hover { transform: scale(1.1); }
#chat-panel {
  position: fixed; bottom: 92px; right: 28px; z-index: 1000;
  width: 300px; background: var(--bg2); border: 1px solid var(--border);
  border-radius: 12px; padding: 16px; box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  display: none;
}
#chat-panel h4 { color: #fff; margin-bottom: 12px; font-size: 14px; }
#chat-input {
  width: 100%; background: var(--bg3); border: 1px solid var(--border);
  border-radius: 6px; color: #fff; padding: 8px 12px; font-size: 13px;
  margin-bottom: 8px; resize: none; height: 64px;
}
#chat-send {
  background: var(--navy); color: #fff; border: none; padding: 8px 16px;
  border-radius: 6px; cursor: pointer; font-size: 13px; width: 100%;
}
#chat-response { font-size: 12px; color: var(--text2); margin-top: 8px; min-height: 20px; }

/* Company colours */
.co-IBM { background: #1f3260; color: #79b8ff; }
.co-Capgemini { background: #1a3d1a; color: #56d364; }
.co-Deloitte { background: #2d1f3d; color: #bc8cff; }
.co-CGI { background: #1f2d3d; color: #58a6ff; }
.co-PA { background: #1f3d2d; color: #3fb950; }
.co-Capita { background: #3d2d1f; color: #d29922; }
.co-PwC { background: #3d1f1f; color: #f85149; }
.co-Atos { background: #1f3d3d; color: #79c0ff; }
.co-Fujitsu { background: #3d1f2d; color: #f778ba; }
</style>
</head>

<header>
  <div>📡</div>

<div class="layout">

    <h3>Archive</h3>

<button id="chat-btn" onclick="toggleChat()" title="Ask about UKI PS">💬</button>
<div id="chat-panel">

  <button id="chat-send" onclick="sendChat()">Send</button>

</div>

dline": "UK Government Launches National Cyber Resilience Pledge; Deloitte Joins as Founding Signatory", "summary": "The UK government launched its National Cyber Resilience Pledge at 10 Downing Street. Deloitte LLP joined as a founding signatory alongside M&S, Nationwide, and Microsoft UK.", "url": "https://www.gov.uk/government/news/businesses-across-britain-sign-up-to-cyber-resilience-pledge-as-ministers-urge-firms-to-strengthen-cyber-defences", "sentiment": 0.6}, {"date": "2026-07-08", "company": "Fujitsu", "headline": "UK Government Commits \u00a3483m to Post Office Technology Transformation, Accelerates Horizon Exit from Fujitsu", "summary": "The Department for Business and Trade committed up to \u00a3483m to modernise the Post Office network, with a Technology Transformation Programme to transition Horizon away from Fujitsu as soon as possible.", "url": "https://www.gov.uk/government/consultations/green-paper-future-of-post-office/outcome/government-response-future-of-the-post-office", "sentiment": -0.4}, {"date": "2026-07-07", "company": "Capita", "headline": "Capita Faces Public Accounts Committee and Street Protest as Civil Service Pension Crisis Deepens", "summary": "Capita appeared before the Public Accounts Committee as PCS union members staged a demonstration outside Old Palace Yard. The Cabinet Office declared Capita 'completely failed' to meet its end-of-June recovery deadline.", "url": "https://www.pcs.org.uk/news-events/news/union-solidarity-round-6-12-july", "sentiment": -0.8}, {"date": "2026-07-03", "company": "Capgemini", "headline": "Capgemini Secures \u00a336m National Highways Service Management Contract", "summary": "Capgemini UK has been appointed National Highways' Service Management Maturity partner on a five-year contract worth \u00a335.9m, running 1 July 2026 to 30 June 2031.", "url": "https://www.techmarketview.com/ukhotviews/archive/2026/07/02/capgemini-secures-36m-national-highways-contract", "sentiment": 0.7}, {"date": "2026-07-03", "company": "CGI", "headline": "CGI IT Wins \u00a314.1m HM Land Registry Strategic Data Partnership", "summary": "HM Land Registry has awarded CGI IT a four-year, \u00a314.1m contract as its Strategic Data Partner, covering geospatial strategy, advanced capabilities, and data governance.", "url": "https://bidstats.uk/tenders/2026/W27/873726057", "sentiment": 0.7}, {"date": "2026-07-02", "company": "Deloitte", "headline": "Home Office splits \u00a3350m data deal between Deloitte and PA Consulting", "summary": "The UK Home Office committed up to \u00a3350m to enhance its Data Services and Analytics unit, awarding Lot A (\u00a3200m) to Deloitte. The four-year contract sees Deloitte provide integrated data teams.", "url": "https://www.techmarketview.com/ukhotviews/archive/2026/07/01/home-office-splits-350m-data-deal-between-deloitte-and-pa-consulting", "sentiment": 0.8}, {"date": "2026-07-02", "company": "PA Consulting", "headline": "PA Consulting wins \u00a3150m Home Office Data Professions contract in shared \u00a3350m award", "summary": "PA Consulting secured Lot B of the Home Office's \u00a3350m Data Services and Analytics contract, valued at up to \u00a3150m over four years, supplying specialist data professionals.", "url": "https://www.techmarketview.com/ukhotviews/archive/2026/07/01/home-office-splits-350m-data-deal-between-deloitte-and-pa-consulting", "sentiment": 0.85}, {"date": "2026-07-01", "company": "Capgemini", "headline": "HMRC selects Capgemini, NICE and Route 101 for customer service transformation", "summary": "HMRC has selected Capgemini alongside NICE and Route 101 to deliver its next-phase customer experience transformation with NICE's CXone cloud contact centre platform.", "url": "https://www.thinkdigitalpartners.com/news/2026/06/30/uk-digital-procurement-roundup-june-2026-contracts-frameworks-and-market-moves/", "sentiment": 0.8}, {"date": "2026-07-01", "company": "Fujitsu", "headline": "Post Office delays signing Horizon replacement contract for third time", "summary": "The Post Office delayed for a third time the formal signing of a \u00a3169.2m contract to replace Fujitsu's ageing Horizon EPOS system. Fujitsu's Horizon system will continue operating beyond its original replacement timeline.", "url": "https://www.computerweekly.com/news/366645261/Post-Office-delays-signing-Horizon-replacement-for-third-time", "sentiment": -0.5}, {"date": "2026-07-01", "company": "Capita", "headline": "Government admits Capita is a prime candidate for insourcing after pension chaos", "summary": "A government minister admitted Capita has 'completely failed' to restore normal service levels to the Civil Service Pension Scheme and described it as 'a prime candidate for future insourcing'.", "url": "https://www.pcs.org.uk/news-events/news/government-admits-capita-prime-candidate-insourcing", "sentiment": -0.85}, {"date": "2026-06-27", "company": "PwC", "headline": "PwC Ireland Calls on Government to Use Budget 2027 as Platform for Innovation and Long-Term Growth", "summary": "PwC Ireland called on the Irish Government to use Budget 2027 as a strategic platform for long-term competitiveness, proposing measures across tax reform, clean energy investment, and housing delivery.", "url": "https://www.thinkbusiness.ie/articles/pwc-budget-2027-ireland-innovation-energy-housing-growth/", "sentiment": 0.3}, {"date": "2026-06-26", "company": "CGI", "headline": "CGI's MyCare.Scot NHS App Expands to Hospital Services Across Scotland", "summary": "Scotland's digital health portal MyCare.Scot, delivered by CGI under a \u00a327.8m contract, is expanding from dermatology outpatients to broader hospital-based services nationwide.", "url": "https://www.digitalhealth.net/2026/06/digital-health-coffee-time-briefing-%E2%98%95-178/", "sentiment": 0.5}, {"date": "2026-06-25", "company": "Deloitte", "headline": "Home Office Expands Deloitte Contract for Online Application Services to Top \u00a3130m", "summary": "The Home Office awarded Deloitte a new five-year contract worth \u00a3131.65m for Apply for Things migration and borders services, at an annual cost over 40% higher than the prior deal.", "url": "https://www.publictechnology.net/2026/06/24/international-relations/home-office-expands-contract-for-online-application-services-to-top-130m/", "sentiment": 0.7}, {"date": "2026-06-23", "company": "IBM", "headline": "IBM wins \u00a3320m UK MOD DEEAMS contract to modernise defence asset management", "summary": "The Ministry of Defence awarded IBM UK a \u00a3320m contract to deliver the Defence Equipment Engineering Asset Management Systems, replacing 17 legacy applications with an AI-powered platform.", "url": "https://uk.newsroom.ibm.com/announcements?item=122908", "sentiment": 0.9}, {"date": "2026-06-23", "company": "Capgemini", "headline": "Capgemini Wins HMRC Migration Partner Role as First SAP Sovereign Cloud Partner", "summary": "Capgemini was appointed by HMRC as Migration Delivery Partner to modernise the UK's Enterprise Tax Management Platform, processing over \u00a3875 billion annually.", "url": "https://www.capgemini.com/gb-en/news/press-releases/capgemini-becomes-first-to-receive-the-sap-sovereign-cloud-partner-designation/", "sentiment": 0.85}, {"date": "2026-06-23", "company": "CGI", "headline": "CGI awarded \u00a3250m HMRC Enterprise Integration Services contract", "summary": "CGI won a contract worth up to \u00a3250m over five years by HMRC to operate and maintain integration services across HMRC's IT estate.", "url": "https://www.cgi.com/en/cgi-awarded-250-million-enterprise-integration-services-contract-his-majesty-revenue-customs-uk", "sentiment": 0.72}, {"date": "2026-06-23", "company": "CGI", "headline": "CGI UK Delivers Borealis Satellite-Tracking System Six Months Ahead of Schedule", "summary": "The UK MoD announced that Borealis, the new satellite threat-tracking software delivered by CGI UK under a \u00a365m contract, reached full operational capability six months ahead of schedule.", "url": "https://www.strategical.org.uk/strategical-briefing/riat-2026-cancelled", "sentiment": 0.82}, {"date": "2026-06-23", "company": "Atos/Eviden", "headline": "Atos invests in UK secure infrastructure to capture growing public sector IT market", "summary": "Atos established new UK-based data and AI infrastructure with military-grade security, holding 37 live UK public sector contracts worth \u00a31.3bn including MoD, HMRC, Home Office, and NSIB.", "url": "https://www.computerweekly.com/news/366632825/Frances-Atos-eyes-UK-public-sector-with-investment-in-secure-UK-infrastructure", "sentiment": 0.3}];
const sentiment = {"IBM": {"avg": 0.55, "cnt": 3, "label": "\ud83d\udfe2 Positive"}, "Capgemini": {"avg": 0.78, "cnt": 5, "label": "\ud83d\udfe2 Positive"}, "Deloitte": {"avg": 0.0, "cnt": 7, "label": "\u26aa Neutral"}, "CGI": {"avg": 0.7, "cnt": 7, "label": "\ud83d\udfe2 Positive"}, "PA Consulting": {"avg": 0.72, "cnt": 3, "label": "\ud83d\udfe2 Positive"}, "Capita": {"avg": -0.49, "cnt": 14, "label": "\ud83d\udfe0 Caution"}, "PwC": {"avg": 0.3, "cnt": 1, "label": "\ud83d\udfe1 Neutral+"}, "Atos/Eviden": {"avg": 0.15, "cnt": 2, "label": "\ud83d\udfe1 Neutral+"}, "Fujitsu": {"avg": -0.47, "cnt": 7, "label": "\ud83d\udfe0 Caution"}};
const companies = ["IBM", "Capgemini", "Deloitte", "CGI", "PA Consulting", "Capita", "PwC", "Atos/Eviden", "Fujitsu"];

// Group by date
const byDate = {};
briefings.forEach(b => {
  if (!byDate[b.date]) byDate[b.date] = [];
  byDate[b.date].push(b);
});
const dates = Object.keys(byDate).sort((a,b) => b.localeCompare(a));

let activeDate = dates[0] || null;
let activeCompany = 'All';

function getCompanyClass(co) {
  if (co === 'IBM') return 'co-IBM';
  if (co === 'Capgemini') return 'co-Capgemini';
  if (co === 'Deloitte') return 'co-Deloitte';
  if (co === 'CGI') return 'co-CGI';
  if (co === 'PA Consulting') return 'co-PA';
  if (co === 'Capita') return 'co-Capita';
  if (co === 'PwC') return 'co-PwC';
  if (co.includes('Atos') || co.includes('Eviden')) return 'co-Atos';
  if (co === 'Fujitsu') return 'co-Fujitsu';
  return '';
}

function getSentColor(s) {
  if (s >= 0.3) return '#3fb950';
  if (s >= 0) return '#e3b341';
  if (s >= -0.3) return '#d29922';
  return '#f85149';
}

function renderDateList() {
  const el = document.getElementById('date-list');
  el.innerHTML = dates.map(d => {
    const cnt = byDate[d].length;
    const active = d === activeDate ? ' active' : '';
    return `<div class="date-item${active}" onclick="setDate('${d}')">${d} <span class="badge">${cnt}</span></div>`;
  }).join('');
}

function renderFilters() {
  const el = document.getElementById('filters');
  const all = ['All', ...companies];
  el.innerHTML = all.map(c => {
    const active = c === activeCompany ? ' active' : '';
    return `<div class="chip${active}" onclick="setCompany('${c}')">${c}</div>`;
  }).join('');
}

function renderCards() {
  const el = document.getElementById('cards');
  let items = activeDate ? (byDate[activeDate] || []) : briefings;
  if (activeCompany !== 'All') {
    items = items.filter(b => b.company === activeCompany);
  }
  if (!items.length) {
    el.innerHTML = '<div class="no-results">🔍 No stories found for this filter.</div>';
    return;
  }
  el.innerHTML = items.map(b => {
    const sc = getSentColor(b.sentiment);
    const cls = getCompanyClass(b.company);
    const flag = (b.company === 'IBM' || b.company === 'Atos/Eviden') ? ' 🇬🇧' : '';
    return `<div class="card">
      <div class="card-meta">
        <span class="company-tag ${cls}">${b.company}${flag}</span>
        <span class="date-tag">${b.date}</span>
        <div class="sentiment-dot" style="background:${sc};margin-left:auto" title="Sentiment: ${b.sentiment}"></div>
      </div>
      <h3>${b.headline}</h3>
      <p>${b.summary}</p>
      <a href="${b.url}" target="_blank">📰 Read article →</a>
    </div>`;
  }).join('');
}

function renderSentiment() {
  const el = document.getElementById('sentiment-bars');
  el.innerHTML = companies.map(co => {
    const sd = sentiment[co];
    if (!sd) return '';
    const avg = sd.avg;
    const label = sd.label;
    const cnt = sd.cnt;
    let barPct, barClass;
    if (avg === null || avg === undefined) {
      barPct = 0; barClass = 'bar-neu';
    } else if (avg >= 0) {
      barPct = Math.round(avg * 100);
      barClass = avg >= 0.1 ? 'bar-pos' : 'bar-neu';
    } else {
      barPct = Math.round(Math.abs(avg) * 100);
      barClass = 'bar-neg';
    }
    const avgStr = avg !== null ? avg.toFixed(2) : '—';
    return `<div class="sentiment-row">
      <div class="co"><span>${co}</span><span style="font-size:11px">${label.split(' ')[0]}</span></div>
      <div class="bar-bg"><div class="bar-fill ${barClass}" style="width:${barPct}%"></div></div>
      <div class="sent-meta">avg ${avgStr} · ${cnt} articles</div>
    </div>`;
  }).join('');
}

function setDate(d) {
  activeDate = activeDate === d ? null : d;
  renderDateList();
  renderCards();
}

function setCompany(c) {
  activeCompany = c;
  renderFilters();
  renderCards();
}

function toggleChat() {
  const p = document.getElementById('chat-panel');
  p.style.display = p.style.display === 'block' ? 'none' : 'block';
}

function sendChat() {
  const msg = document.getElementById('chat-input').value.trim();
  if (!msg) return;
  const res = document.getElementById('chat-response');
  res.textContent = 'Sending...';
  fetch('https://hooks.tasklet.io/watchtower-chat', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({type: 'chat', message: msg})
  }).then(r => r.json()).then(d => {
    res.textContent = d.reply || 'Response received.';
  }).catch(() => {
    res.textContent = 'Could not connect. Try again later.';
  });
}

// Init
renderDateList();
renderFilters();
renderCards();
renderSentiment();
</script>
</body>
</html>
