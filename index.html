<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UKI PS Watchtower</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --sidebar: #0d1117;
    --card: #1c2128;
    --border: #30363d;
    --green: #00a651;
    --navy: #0a2240;
    --text: #e6edf3;
    --muted: #8b949e;
    --chip-bg: #21262d;
    --chip-active: #00a651;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; display: flex; flex-direction: column; min-height: 100vh; }
  header { background: #0a2240; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
  header h1 { font-size: 18px; color: #fff; font-weight: 700; }
  header span { font-size: 12px; color: #90c0e0; }
  .layout { display: flex; flex: 1; min-height: 0; }
  /* Sidebar */
  .sidebar { width: 200px; min-width: 180px; background: var(--sidebar); border-right: 1px solid var(--border); padding: 16px 0; overflow-y: auto; }
  .sidebar h3 { font-size: 11px; text-transform: uppercase; color: var(--muted); padding: 0 14px 8px; letter-spacing: 1px; }
  .date-item { padding: 8px 14px; cursor: pointer; font-size: 13px; border-left: 3px solid transparent; transition: all 0.15s; }
  .date-item:hover, .date-item.active { background: var(--panel); border-left-color: var(--green); color: var(--green); }
  .date-count { float: right; font-size: 11px; background: var(--chip-bg); border-radius: 10px; padding: 1px 7px; color: var(--muted); }
  /* Main */
  .main { flex: 1; overflow-y: auto; padding: 20px; }
  .filter-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
  .chip { background: var(--chip-bg); border: 1px solid var(--border); border-radius: 20px; padding: 5px 14px; font-size: 12px; cursor: pointer; transition: all 0.15s; }
  .chip:hover, .chip.active { background: var(--chip-active); color: #fff; border-color: var(--chip-active); }
  .cards { display: flex; flex-direction: column; gap: 14px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 16px 18px; }
  .card-company { font-size: 11px; text-transform: uppercase; color: var(--green); font-weight: 700; letter-spacing: 1px; margin-bottom: 8px; }
  .card h3 { font-size: 14px; font-weight: 600; margin-bottom: 8px; line-height: 1.4; }
  .card h3 a { color: var(--text); text-decoration: none; }
  .card h3 a:hover { color: var(--green); }
  .card p { font-size: 13px; color: var(--muted); line-height: 1.6; margin-bottom: 8px; }
  .card-footer { display: flex; align-items: center; justify-content: space-between; font-size: 11px; color: var(--muted); }
  .card-footer a { color: var(--green); text-decoration: none; }
  .no-news { color: var(--muted); font-size: 13px; font-style: italic; padding: 12px 0; text-align: center; }
  /* Right panel */
  .rightpanel { width: 240px; min-width: 220px; background: var(--panel); border-left: 1px solid var(--border); padding: 16px 14px; overflow-y: auto; }
  .rightpanel h3 { font-size: 11px; text-transform: uppercase; color: var(--muted); margin-bottom: 14px; letter-spacing: 1px; }
  .sent-row { margin-bottom: 12px; }
  .sent-company { font-size: 12px; font-weight: 600; margin-bottom: 4px; }
  .sent-bar-wrap { background: #21262d; border-radius: 4px; height: 8px; margin-bottom: 2px; }
  .sent-bar { height: 8px; border-radius: 4px; transition: width 0.3s; }
  .sent-score { font-size: 11px; color: var(--muted); }
  /* Chat widget */
  #chat-btn { position: fixed; bottom: 24px; right: 24px; width: 54px; height: 54px; border-radius: 50%; background: var(--green); border: none; cursor: pointer; font-size: 24px; box-shadow: 0 4px 16px rgba(0,166,81,0.4); z-index: 1000; transition: transform 0.15s; }
  #chat-btn:hover { transform: scale(1.08); }
  #chat-panel { position: fixed; bottom: 90px; right: 24px; width: 320px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; z-index: 1000; display: none; box-shadow: 0 8px 30px rgba(0,0,0,0.5); }
  #chat-panel h4 { font-size: 14px; margin-bottom: 12px; color: var(--green); }
  #chat-input { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; color: var(--text); font-size: 13px; margin-bottom: 8px; resize: none; }
  #chat-send { background: var(--green); color: #fff; border: none; border-radius: 6px; padding: 8px 16px; cursor: pointer; font-size: 13px; width: 100%; }
  #chat-send:hover { opacity: 0.9; }
  #chat-response { font-size: 12px; color: var(--muted); margin-top: 8px; min-height: 20px; }
  @media (max-width: 900px) {
    .sidebar { display: none; }
    .rightpanel { display: none; }
  }
</style>
</head>
<body>

      <div class="sent-row">

        <div class="sent-bar-wrap">
          <div class="sent-bar" style="width:18%;background:#e03c3c;"></div>
        </div>
        <div class="sent-score">-0.62</div>
      </div>
  </aside>
</div>

<button id="chat-btn" title="Ask Watchtower" onclick="toggleChat()">💬</button>
<div id="chat-panel">
  <h4>💬 Ask Watchtower</h4>
  <textarea id="chat-input" rows="3" placeholder="Ask about UK public sector tech news..."></textarea>
  <button id="chat-send" onclick="sendChat()">Send</button>
  <div id="chat-response"></div>
</div>

<script>
const ALL_ARTICLES = [{"date": "2026-06-25", "company": "Deloitte", "headline": "Home Office Expands Deloitte Contract for Online Application Services to Top £130m", "summary": "The Home Office has awarded Deloitte a new five-year contract worth £131.65m to support its Apply for Things migration and borders services—covering visa and leave-to-remain applications—at an annual cost over 40% higher than the prior deal. The contract, running from September 2026 to August 2030 with an optional one-year extension, secures Deloitte access to a pool of skilled resources mobilisable at pace to deliver, develop and operate the digital application suite.", "url": "https://www.publictechnology.net/2026/06/24/international-relations/home-office-expands-contract-for-online-application-services-to-top-130m/", "sentiment": 0.7}, {"date": "2026-06-24", "company": "Capita", "headline": "Capita Civil Service Pension Recovery: June 30 Deadline Likely to Be Missed", "summary": "With 13,000 retirement quotations still outstanding as of 17 June, civil service unions have described the end-of-June recovery target as \"completely fanciful.\" The Cabinet Office-mandated deadline covers clearing backlogs affecting tens of thousands of civil service pensioners, with some bereaved beneficiaries still waiting nine months for pension payments. Parliamentary scrutiny of Capita's contract management is scheduled for a joint PAC/PAAC session on 8 July.", "url": "https://www.cspa.co.uk/news/june-deadline/", "sentiment": -0.8}, {"date": "2026-06-24", "company": "Fujitsu", "headline": "Fujitsu Still Collecting Government Contracts Despite Zero Contribution to Horizon Compensation", "summary": "An i Paper analysis spotlights that Fujitsu has not contributed a single penny to the £2 billion Post Office Horizon compensation bill while continuing to hold UK government contracts. The firm's ongoing public sector contract relationships draw fresh scrutiny as a new interim government takes office and faces pr "https://www.strategical.org.uk/strategical-briefing/riat-2026-cancelled", "sentiment": 0.82}, {"date": "2026-06-23", "company": "Capgemini", "headline": "Capgemini Wins HMRC Migration Partner Role as First SAP Sovereign Cloud Partner", "summary": "Capgemini has been appointed by HMRC as Migration Delivery Partner to modernise the UK's Enterprise Tax Management Platform — a critical system supporting 50+ tax regimes and processing over £875 billion annually. The win coincides with Capgemini becoming the world's first SAP Sovereign Cloud Partner.", "url": "https://www.capgemini.com/gb-en/news/press-releases/capgemini-becomes-first-to-receive-the-sap-sovereign-cloud-partner-designation/", "sentiment": 0.85}, {"date": "2026-06-23", "company": "Capgemini", "headline": "HMRC signs £600m multi-year deal with Capgemini to digitise customer service with AI", "summary": "HM Revenue & Customs has awarded a multi-year contract worth up to £600 million to Capgemini, NiCE, and Route 101 to overhaul its customer service operations via an AI-powered cloud contact centre.", "url": "https://www.capgemini.com/us-en/news/press-releases/capgemini-nice-and-route-101-to-meet-evolving-needs-of-uk-citizens/", "sentiment": 0.8}, {"date": "2026-06-23", "company": "Capita", "headline": "Capita Confirmed to Miss June 30 Deadline to Fix Civil Service Pension Scheme", "summary": "The Cabinet Office has confirmed that Capita will fail to meet the ministerial deadline of 30 June 2026 to restore the Civil Service Pension Scheme to contractual standards. The PCS union has called for the scheme to be brought back in-house, noting that 607 MPs have already received constituent complaints.", "url": "https://www.theregister.com/public-sector/2026/06/16/capita-is-about-to-sail-past-deadline-to-fix-civil-service-pensions-scheme/5256022", "sentiment": -0.8}, {"date": "2026-06-23", "company": "Capita", "headline": "Capita secures decade-long £959m Synergy government contract", "summary": "Capita has been awarded the Synergy Business Process Services contract — worth £370m initially and up to £959m over 10 years — to deliver IT-enabled back-office services for the DWP, Ministry of Justice, Home Office, and Defra.", "url": "https://www.computerweekly.com/news/366639758/Capita-secures-decade-long-government-contract-amid-failure-in-public-sight", "sentiment": 0.4}, {"date": "2026-06-23", "company": "Deloitte", "headline": "Deloitte wins £132m Home Office contract despite government's consultancy spending crackdown", "summary": "TechMarketView reports that Deloitte has secured a £132 million contract with the Home Office, a significant win even as the UK government pursues targets to halve consultancy expenditure. The contract win demonstrates that flagship transformation programmes continue to attract major consulting firms.", "url": "https://www.techmarketview.com/ukhotviews/archive/2026/06/17/deloitte-wins-132m-home-office-contract", "sentiment": 0.7}, {"date": "2026-06-23", "company": "Deloitte", "headline": "Deloitte Launches London AI Studio with Google Cloud for UK Agentic AI", "summary": "Deloitte opened a new AI Studio on its London campus in partnership with Google Cloud, designed to help UK organisations — including public sector bodies — move from AI experimentation to production-ready agentic systems. The studio will run four-week innovation sprints and certify 1,000 UK AI engineers.", "url": "https://www.deloitte.com/uk/en/about/press-room/deloitte-and-google-cloud-collaborate-to-launch-london-ai-studio.html", "sentiment": 0.65}, {"date": "2026-06-23", "company": "Fujitsu", "headline": "Post Office signs £492m contracts with Accenture to replace Horizon, ejecting Fujitsu", "summary": "The UK Post Office has awarded Accenture a £322.8m contract to replace Fujitsu's controversial Horizon system, which led to over 900 wrongful convictions of subpostmasters. Fujitsu will continue supporting Horizon during a managed transition period with a £41m extension to March 2027.", "url": "https://www.datacenterdynamics.com/en/news/fujitsu-finally-set-to-exit-uk-post-office-it-contract/", "sentiment": -0.55}, {"date": "2026-06-23", "company": "IBM", "headline": "IBM wins £320m UK MOD DEEAMS contract to modernise defence asset management", "summary": "The Ministry of Defence has awarded IBM UK a £320 million contract to deliver the Defence Equipment Engineering Asset Management Systems, replacing 17 fragmented legacy applications with a single AI-powered platform serving 65,000 users and creating 100 new UK jobs.", "url": "https://www.gov.uk/government/news/boost-to-jobs-and-military-capability-with-new-defence-equipment-system", "sentiment": 0.75}, {"date": "2026-06-23", "company": "IBM", "headline": "IBM Marks 70 Years in Ireland with €11.5M Tech Donation to SETU Waterford", "summary": "IBM celebrated its 70th anniversary in Ireland by donating an €11.5 million technology system including an IBM z17 mainframe to South East Technological University (SETU) Waterford, with the Taoiseach in attendance.", "url": "https://uk.newsroom.ibm.com/IBM-celebrates-70-years-in-ireland", "sentiment": 0.65}, {"date": "2026-06-23", "company": "PA Consulting", "headline": "Jiten Kachhela Named President of PA Consulting under Jacobs", "summary": "Jacobs has appointed Jiten Kachhela — a 20-year PA veteran and former Global Head of Digital & Data — as President of PA Consulting. The leadership change signals strategic continuity with an emphasis on digital growth and expanded public-sector client relationships.", "url": "https://www.paconsulting.com/newsroom/jiten-kachhela-announced-as-president-of-pa-consulting-10-june-2026", "sentiment": 0.3}, {"date": "2026-06-23", "company": "PA Consulting", "headline": "PA Consulting Named in The Times Top 50 Employers for Gender Equality 2026", "summary": "PA Consulting has been recognised in The Times Top 50 Employers for Gender Equality 2026, recognised by Business in the Community, reflecting its ongoing DE&I commitments in UK operations.", "url": "https://www.bitc.org.uk/news/the-times-top-50-employers-for-gender-equality-2026-announced/", "sentiment": 0.4}, {"date": "2026-06-23", "company": "PwC", "headline": "PwC Warns Record UK Borrowing of £23.3bn in May Leaves Public Finances Exposed", "summary": "PwC UK economist Nabil Taleb has warned that May 2026's public sector net borrowing of £23.3 billion — £5.6 billion above OBR forecasts — leaves the UK government with little fiscal headroom. Debt interest hit a May record of £11.7 billion.", "url": "https://www.pwc.co.uk/press-room/press-releases/research-commentary/2026/pwc-comments-on-public-sector-finance-data---june-2026.html", "sentiment": -0.15}, {"date": "2026-06-23", "company": "PwC", "headline": "PwC UK Named Times Top 50 Employer for Gender Equality for 16th Consecutive Year", "summary": "PwC UK has been named in The Times Top 50 Employers for Gender Equality 2026 for the 16th year running, recognised by Business in the Community.", "url": "https://www.pwc.co.uk/press-room/press-releases/corporate-news/pwc-uk-named-a-top-50-employer-for-gender-equality-.html", "sentiment": 0.4}];
const ALL_DATES = [{"date": "2026-06-25", "count": 1}, {"date": "2026-06-24", "count": 2}, {"date": "2026-06-23", "count": 16}];
const COMPANIES = ["All","IBM","Capgemini","Deloitte","CGI","PA Consulting","Capita","PwC","Atos/Eviden","Fujitsu"];

let activeDate = ALL_DATES.length > 0 ? ALL_DATES[0].date : null;
let activeCompany = "All";

function renderSidebar() {
  const el = document.getElementById('date-list');
  el.innerHTML = '';
  ALL_DATES.forEach(d => {
    const div = document.createElement('div');
    div.className = 'date-item' + (d.date === activeDate ? ' active' : '');
    div.innerHTML = `${d.date} <span class="date-count">${d.count}</span>`;
    div.onclick = () => { activeDate = d.date; renderAll(); };
    el.appendChild(div);
  });
}

function renderChips() {
  const el = document.getElementById('chips');
  el.innerHTML = '';
  COMPANIES.forEach(c => {
    const div = document.createElement('div');
    div.className = 'chip' + (c === activeCompany ? ' active' : '');
    div.textContent = c;
    div.onclick = () => { activeCompany = c; renderAll(); };
    el.appendChild(div);
  });
}

function renderCards() {
  const el = document.getElementById('cards');
  el.innerHTML = '';
  let articles = ALL_ARTICLES;
  if (activeDate) articles = articles.filter(a => a.date === activeDate);
  if (activeCompany !== 'All') articles = articles.filter(a => a.company === activeCompany);
  if (articles.length === 0) {
    el.innerHTML = '<p class="no-news">No stories found for the selected filters.</p>';
    return;
  }
  articles.forEach(a => {
    const sentColor = a.sentiment >= 0.5 ? '#00a651' : a.sentiment >= 0.1 ? '#f5c842' : a.sentiment >= -0.1 ? '#aaa' : a.sentiment >= -0.5 ? '#f5922f' : '#e03c3c';
    const flag = (a.company === 'IBM' || a.company === 'Atos/Eviden') ? ' 🇬🇧' : '';
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="card-company">${a.company}${flag}</div>
      <h3><a href="${a.url}" target="_blank">${a.headline}</a></h3>
      <p>${a.summary}</p>
      <div class="card-footer">
        <span>${a.date}</span>
        <span style="color:${sentColor};">⬤ ${a.sentiment >= 0.5 ? 'Positive' : a.sentiment >= 0.1 ? 'Neutral+' : a.sentiment >= -0.1 ? 'Neutral' : a.sentiment >= -0.5 ? 'Caution' : 'Negative'}</span>
        <a href="${a.url}" target="_blank">Read →</a>
      </div>`;
    el.appendChild(card);
  });
}

function renderAll() {
  renderSidebar();
  renderChips();
  renderCards();
}

renderAll();

function toggleChat() {
  const p = document.getElementById('chat-panel');
  p.style.display = p.style.display === 'block' ? 'none' : 'block';
}

async function sendChat() {
  const msg = document.getElementById('chat-input').value.trim();
  if (!msg) return;
  const resp = document.getElementById('chat-response');
  resp.textContent = 'Sending...';
  try {
    const r = await fetch('https://hooks.tasklet.ai/watchtower', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({type: 'chat', message: msg})
    });
    const d = await r.json().catch(() => ({}));
    resp.textContent = d.reply || 'Message sent!';
  } catch(e) {
    resp.textContent = 'Message queued. Check back soon.';
  }
}
</script>
</body>
</html>
