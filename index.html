  .chat-send { margin-top: 8px; width: 100%; padding: 9px; background: var(--navy); border: none; border-radius: 8px; color: #ffffff; font-weight: 700; font-size: 13px; cursor: pointer; font-family: "Inter", sans-serif; }

  .chat-resp { margin-top: 10px; font-size: 12px; color: var(--muted); min-height: 20px; }

  @media (max-width: 900px) {

ty scales.", "url": "https://www.strategical.org.uk/strategical-briefing/riat-2026-cancelled", "sentiment": 0.82, "sent_label": "\ud83d\udfe2 Positive", "sent_color": "#48bb78", "bg": "#c6f6d5"}, {"date": "2026-06-23", "company": "CGI", "headline": "CGI 2026 AI Research: Only 20% of Enterprises Extend AI Strategy Across the Ecosystem", "summary": "CGI's global 2026 Voice of Our Clients research finds 62% of organisations are now applying AI to core processes, but only 20% have extended their AI strategy across the full enterprise ecosystem. The research draws on interviews with 2,000 business and IT executives including UK public sector clients. CGI positions this gap as a key opportunity for its managed services and AI integration offerings.", "url": "https://www.stocktitan.net/news/GIB/c-suite-ai-adoption-is-rising-yet-ambition-is-outpacing-enterprise-1cjcqljno368.html", "sentiment": 0.2, "sent_label": "\ud83d\udfe1 Neutral+", "sent_color": "#ecc94b", "bg": "#ebf8ff"}, {"date": "2026-06-23", "company": "CGI", "headline": "CGI awarded \u00a3250m HMRC Enterprise Integration Services contract to modernise IT estate", "summary": "CGI has been awarded a contract worth up to \u00a3250 million over five years by HM Revenue & Customs to operate and maintain integration services across HMRC's IT estate. The contract deepens CGI's existing partnership with HMRC and supports the broader modernisation of government digital infrastructure. HMRC cited CGI's track record in mission-critical integration as a key reason for the award, which will help accelerate the delivery of improved digital services for UK taxpayers.", "url": "https://www.cgi.com/en/cgi-awarded-250-million-enterprise-integration-services-contract-his-majesty-revenue-customs-uk", "sentiment": 0.72, "sent_label": "\ud83d\udfe2 Positive", "sent_color": "#48bb78", "bg": "#c6f6d5"}, {"date": "2026-06-23", "company": "Capgemini", "headline": "Capgemini Wins HMRC Migration Partner Role as First SAP Sovereign Cloud Par const SENTIMENTS = [{"company": "IBM", "avg_sent": 0.55, "cnt": 4}, {"company": "Capgemini", "avg_sent": 0.825, "cnt": 2}, {"company": "Deloitte", "avg_sent": 0.675, "cnt": 2}, {"company": "CGI", "avg_sent": 0.58, "cnt": 3}, {"company": "PA Consulting", "avg_sent": 0.283, "cnt": 3}, {"company": "Capita", "avg_sent": -0.2125, "cnt": 4}, {"company": "PwC", "avg_sent": 0.2, "cnt": 3}, {"company": "Atos/Eviden", "avg_sent": 0.15, "cnt": 2}, {"company": "Fujitsu", "avg_sent": -0.625, "cnt": 2}];

function sentimentLabel(s) {
  if (s >= 0.5) return ["🟢 Positive", "#48bb78"];
  if (s >= 0.1) return ["🟡 Neutral+", "#ecc94b"];
  if (s >= -0.1) return ["⚪ Neutral", "#a0aec0"];
  if (s >= -0.5) return ["🟠 Caution", "#ed8936"];
  return ["🔴 Negative", "#fc5c65"];
}

function sentimentBg(s) {
  if (s >= 0.3) return "rgba(10,124,89,0.06)";
  if (s >= 0) return "rgba(29,95,173,0.05)";
  if (s >= -0.3) return "rgba(192,86,33,0.07)";
  return "rgba(197,48,48,0.07)";
}

let activeDate = 'all';
let activeCompany = 'all';

function filterDate(d) {
  activeDate = d;
  document.querySelectorAll('.date-item').forEach(el => el.classList.toggle('active', el.dataset.date === d));
  renderStories();
}

function filterCompany(co, btn) {
  activeCompany = co;
  document.querySelectorAll('.chip').forEach(el => el.classList.remove('active'));
  btn.classList.add('active');
  renderStories();
}

function renderStories() {
  let filtered = STORIES;
  if (activeDate !== 'all') filtered = filtered.filter(s => s.date === activeDate);
  if (activeCompany !== 'all') filtered = filtered.filter(s => s.company === activeCompany);

  const container = document.getElementById('stories-container');
  if (filtered.length === 0) {
    container.innerHTML = '<div class="no-stories">No stories match the current filter.</div>';
    return;
  }

  // Group by date
  const byDate = {};
  filtered.forEach(s => {
    if (!byDate[s.date]) byDate[s.date] = [];
    byDate[s.date].push(s);
  });

  let html = '';
  Object.keys(byDate).sort((a,b) => b.localeCompare(a)).forEach(date => {
    html += `<div class="section-head">📅 ${date} · ${byDate[date].length} ${byDate[date].length===1?'story':'stories'}</div>`;
    byDate[date].forEach(s => {
      const [lbl, color] = sentimentLabel(s.sentiment);
      const bg = sentimentBg(s.sentiment);
      html += `<div class="card" style="border-left: 3px solid ${color}; background: linear-gradient(135deg, var(--surface) 0%, ${bg} 100%);">
        <div class="card-co"><span>${s.company}</span><span class="card-date">${s.date}</span></div>
        <div class="card-headline">${s.headline}</div>
        <div class="card-summary">${s.summary}</div>
        <div class="card-footer">
          <a class="card-link" href="${s.url}" target="_blank">Read article →</a>
          <span class="sent-badge" style="background:${color}20;color:${color}">${lbl} (${s.sentiment > 0 ? '+' : ''}${s.sentiment.toFixed(2)})</span>
        </div>
      </div>`;
    });
  });
  container.innerHTML = html;
}

function renderSentiment() {
  const order = ["IBM","Capgemini","Deloitte","CGI","PA Consulting","Capita","PwC","Atos/Eviden","Fujitsu"];
  const smap = {};
  SENTIMENTS.forEach(s => smap[s.company] = s);
  
  let html = '';
  order.forEach(co => {
    const s = smap[co] || {avg_sent: 0, cnt: 0};
    const sent = s.avg_sent;
    const [lbl, color] = sentimentLabel(sent);
    const pct = Math.max(5, Math.min(95, Math.round((sent + 1) / 2 * 90 + 5)));
    html += `<div class="sent-row">
      <div class="sent-co">
        <span class="sent-co-name">${co}</span>
        <span class="sent-co-meta">${s.cnt} arts</span>
      </div>
      <div class="sent-bar-wrap"><div class="sent-bar" style="width:${pct}%;background:${color}"></div></div>
      <div class="sent-bottom"><span style="color:${color}">${lbl}</span><span>${sent > 0 ? '+' : ''}${sent.toFixed(2)}</span></div>
    </div>`;
  });
  document.getElementById('sent-bars').innerHTML = html;
}

function toggleChat() {
  document.getElementById('chat-panel').classList.toggle('open');
}

async function sendChat() {
  const msg = document.getElementById('chat-input').value.trim();
  if (!msg) return;
  document.getElementById('chat-resp').textContent = 'Sending...';
  try {
    const res = await fetch('https://webhook.site/placeholder-watchtower', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({type: 'chat', message: msg})
    });
    document.getElementById('chat-resp').textContent = 'Message sent! The team will respond via email.';
  } catch(e) {
    document.getElementById('chat-resp').textContent = 'Could not send — please email watchtower@rahul.ai directly.';
  }
  document.getElementById('chat-input').value = '';
}

// Init
renderStories();
renderSentiment();

// Set first date as active by default
const firstDate = document.querySelector('.date-item');
if (firstDate) firstDate.classList.add('active');
</script>
