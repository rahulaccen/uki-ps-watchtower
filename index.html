<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UKI PS Watchtower</title>
<style>
  :root {
    --bg: #0d1117;
    --bg2: #161b22;
    --bg3: #21262d;
    --border: #30363d;
    --text: #e6edf3;
    --text2: #8b949e;
    --accent: #58a6ff;
    --green: #3fb950;
    --yellow: #d29922;
    --orange: #db6d28;
    --red: #f85149;
    --gray: #8b949e;
    --navy: #0f2847;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; display: flex; flex-direction: column; min-height: 100vh; }
  
  header {
    background: linear-gradient(135deg, #0f2847 0%, #1a3a6b 100%);
    border-bottom: 1px solid var(--border);
    padding: 18px 24px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  header .logo { font-size: 22px; font-weight: 700; color: #fff; }
  header .tagline { font-size: 13px; color: #93c5fd; margin-top: 2px; }
  header .badge { margin-left: auto; background: rgba(88,166,255,0.15); border: 1px solid #58a6ff40; color: #58a6ff; font-size: 12px; padding: 4px 12px; border-radius: 20px; }
  
  .layout { display: flex; flex: 1; overflow: hidden; height: calc(100vh - 65px); }
  
  /* Sidebar */
  .sidebar { width: 200px; background: var(--bg2); border-right: 1px solid var(--border); overflow-y: auto; flex-shrink: 0; }
  .sidebar-title { padding: 14px 16px 8px; font-size: 11px; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: 0.08em; }
  .date-item { padding: 10px 16px; cursor: pointer; border-bottom: 1px solid var(--border); transition: background 0.15s; display: flex; justify-content: space-between; align-items: center; }
  .date-item:hover { background: var(--bg3); }
  .date-item.active { background: rgba(88,166,255,0.1); border-left: 3px solid var(--accent); }
  .date-item .date-label { font-size: 13px; color: var(--text); font-weight: 500; }
  .date-item .date-count { font-size: 11px; background: var(--bg3); color: var(--text2); padding: 1px 7px; border-radius: 10px; }
  
  /* Main */
  .main { flex: 1; overflow-y: auto; padding: 20px; }
  
  /* Filters */
  .filter-bar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
  .chip { padding: 5px 14px; border-radius: 20px; font-size: 12px; font-weight: 500; cursor: pointer; border: 1px solid var(--border); background: var(--bg2); color: var(--text2); transition: all 0.15s; user-select: none; }
  .chip:hover { border-color: var(--accent); color: var(--accent); }
  .chip.active { background: rgba(88,166,255,0.15); border-color: var(--accent); color: var(--accent); }
  
  /* Cards */
  .card { background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; padding: 18px 20px; margin-bottom: 14px; transition: border-color 0.15s; }
  .card:hover { border-color: #58a6ff40; }
  .card-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .company-tag { font-size: 11px; font-weight: 600; background: var(--bg3); color: var(--text); padding: 3px 10px; border-radius: 12px; text-transform: uppercase; letter-spacing: 0.04em; }
  .sentiment-tag { font-size: 11px; font-weight: 500; padding: 3px 10px; border-radius: 12px; }
  .sent-pos { background: rgba(63,185,80,0.15); color: #3fb950; }
  .sent-neutral-pos { background: rgba(210,153,34,0.15); color: #d29922; }
  .sent-neutral { background: rgba(139,148,158,0.15); color: #8b949e; }
  .sent-caution { background: rgba(219,109,40,0.15); color: #db6d28; }
  .sent-neg { background: rgba(248,81,73,0.15); color: #f85149; }
  .card-date { font-size: 11px; color: var(--text2); margin-left: auto; }
  .card h3 { font-size: 15px; font-weight: 600; color: var(--text); margin-bottom: 8px; line-height: 1.4; }
  .card h3 a { color: var(--accent); text-decoration: none; }
  .card h3 a:hover { text-decoration: underline; }
  .card p { font-size: 13px; color: var(--text2); line-height: 1.6; margin-bottom: 8px; }
  .card-footer { font-size: 12px; color: var(--text2); }
  .card-footer a { color: var(--text2); text-decoration: none; }
  .card-footer a:hover { color: var(--accent); }
  
  /* Right panel */
  .right-panel { width: 260px; background: var(--bg2); border-left: 1px solid var(--border); overflow-y: auto; flex-shrink: 0; padding: 16px; }
  .panel-title { font-size: 12px; font-weight: 700; color: var(--text2); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 16px; }
  .sentiment-row { margin-bottom: 14px; }
  .sentiment-row .label { font-size: 12px; font-weight: 600; color: var(--text); margin-bottom: 4px; display: flex; justify-content: space-between; }
  .sentiment-row .score { font-size: 11px; color: var(--text2); }
  .bar-track { background: var(--bg3); border-radius: 4px; height: 8px; width: 100%; overflow: hidden; }
  .bar-fill { height: 8px; border-radius: 4px; }
  
  /* Chat widget */
  #chat-btn {
    position: fixed; bottom: 24px; right: 24px; width: 52px; height: 52px;
    background: linear-gradient(135deg, #1e40af, #3b82f6);
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
    cursor: pointer; box-shadow: 0 4px 20px rgba(59,130,246,0.4);
    border: none; color: white; font-size: 22px; z-index: 1000;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  #chat-btn:hover { transform: scale(1.1); box-shadow: 0 6px 24px rgba(59,130,246,0.6); }
  #chat-panel {
    position: fixed; bottom: 90px; right: 24px; width: 320px; background: var(--bg2);
    border: 1px solid var(--border); border-radius: 12px; padding: 16px;
    z-index: 1000; display: none; box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }
  #chat-panel.open { display: block; }
  #chat-panel h4 { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 12px; }
  #chat-input { width: 100%; background: var(--bg3); border: 1px solid var(--border); color: var(--text); padding: 8px 12px; border-radius: 8px; font-size: 13px; margin-bottom: 8px; outline: none; }
  #chat-input:focus { border-color: var(--accent); }
  #chat-send { width: 100%; background: var(--accent); border: none; color: #fff; padding: 8px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; }
  #chat-send:hover { background: #79b8ff; }
  #chat-response { margin-top: 10px; font-size: 12px; color: var(--text2); min-height: 20px; }
  
  @media (max-width: 900px) {
    .right-panel { display: none; }
    .sidebar { width: 160px; }
  }
  @media (max-width: 600px) {
    .sidebar { display: none; }
    .layout { height: auto; }
    .main { overflow: visible; }
  }
</style>
</head>
<body>

<header>
  <div>
    <div class="logo">📡 UKI PS Watchtower</div>
    <div class="tagline">UK &amp; Ireland Public Sector Intelligence</div>
  </div>
  <div class="badge">Live Briefing</div>
</header>

<div class="layout">
  <!-- Sidebar: dates -->
  <div class="sidebar">
    <div class="sidebar-title">Dates</div>
    <div id="date-list"></div>
  </div>
  
  <!-- Main content -->
  <div class="main">
    <div class="filter-bar" id="filter-bar">
      <div class="chip active" data-filter="All">All</div>
    </div>
    <div id="cards-container"></div>
  </div>
  
  <!-- Right panel: sentiment -->
  <div class="right-panel">
    <div class="panel-title">7-Day Sentiment</div>
    <div id="sentiment-panel"></div>
  </div>
</div>

<!-- Chat widget -->
<button id="chat-btn" onclick="toggleChat()" title="Ask the Watchtower">💬</button>
<div id="chat-panel">
  <h4>💬 Ask the Watchtower</h4>
  <input id="chat-input" type="text" placeholder="e.g. What's happening with Capita?" />
  <button id="chat-send" onclick="sendChat()">Send</button>
  <div id="chat-response"></div>
</div>

<script>
const articles = [{"date": "2026-06-23", "company": "IBM", "headline": "IBM wins \u00a3320m UK MOD DEEAMS contract to modernise defence asset management", "summary": "The Ministry of Defence has awarded IBM UK a \u00a3320 million contract to deliver the Defence Equipment Engineering Asset Management Systems (DEEAMS), replacing 17 fragmented legacy applications with a single AI-powered platform. The platform will serve 65,000 users across 130+ major military assets, enabling real-time predictive maintenance and logistics decisions.", "url": "https://www.gov.uk/government/news/boost-to-jobs-and-military-capability-with-new-defence-equipment-system", "sentiment": 0.75}, {"date": "2026-06-23", "company": "Capgemini", "headline": "HMRC signs \u00a3600m multi-year deal with Capgemini to digitise customer service with AI", "summary": "HM Revenue & Customs has awarded a multi-year contract worth up to \u00a3600 million to Capgemini, NiCE, and Route 101 to overhaul its customer service operations via an AI-powered cloud contact centre. The deal aims to modernise taxpayer support as HMRC pushes its digital transformation agenda.", "url": "https://www.capgemini.com/us-en/news/press-releases/capgemini-nice-and-route-101-to-meet-evolving-needs-of-uk-citizens/", "sentiment": 0.8}, {"date": "2026-06-23", "company": "Deloitte", "headline": "Deloitte wins \u00a3132m Home Office contract despite government's consultancy spending crackdown", "summary": "TechMarketView reports that Deloitte has secured a \u00a3132 million contract with the Home Office, a significant win even as the UK government pursues targets to halve consultancy expenditure. Deloitte's public sector practice remains a top performer in the face of structural headwinds.", "url": "https://www.techmarketview.com/ukhotviews/archive/2026/06/17/deloitte-wins-132m-home-office-contract", "sentiment": 0.7}, {"date": "2026-06-23", "company": "CGI", "headline": "CGI awarded \u00a3250m HMRC Enterprise Integration Services contract to modernise IT estate", "summary": "CGI has been awarded a contract worth up to \u00a3250 million over five years by HM Revenue & Customs to operate and maintain integration services across HMRC's IT estate, deepening their existing partnership and supporting broader government digital modernisation.", "url": "https://www.cgi.com/en/cgi-awarded-250-million-enterprise-integration-services-contract-his-majesty-revenue-customs-uk", "sentiment": 0.72}, {"date": "2026-06-23", "company": "PA Consulting", "headline": "PA Consulting appoints new President in strategic leadership transition", "summary": "TechMarketView reports that PA Consulting has announced the appointment of a new President, marking a notable leadership transition at the UK-headquartered management consulting firm as it positions itself for growth in government and public sector markets.", "url": "https://www.techmarketview.com/ukhotviews/archive/2026/06/15/a-new-president-for-pa-consulting", "sentiment": 0.15}, {"date": "2026-06-23", "company": "Capita", "headline": "Capita secures decade-long \u00a3959m Synergy government contract for four major departments", "summary": "Capita has been awarded the Synergy Business Process Services contract \u2014 worth \u00a3370m initially and up to \u00a3959m over 10 years \u2014 to deliver IT-enabled back-office services for the DWP, Ministry of Justice, Home Office, and Defra. The win comes despite ongoing public scrutiny of Capita's performance.", "url": "https://www.computerweekly.com/news/366639758/Capita-secures-decade-long-government-contract-amid-failure-in-public-sight", "sentiment": 0.4}, {"date": "2026-06-23", "company": "PwC", "headline": "PwC leads MCA Awards 2026 shortlist with 33 nominations as UK government consulting spend hits record \u00a33.7bn", "summary": "PwC has the highest representation on the 2026 MCA Awards shortlist with 33 finalists. New Tussell data shows UK government spending on consulting reached a record \u00a33.7 billion in 2024/25, with PwC's strong showing across transformation, digital, and health sectors.", "url": "https://www.consultancy.uk/news/44186/government-consulting-spend-hits-37-billion", "sentiment": 0.35}, {"date": "2026-06-23", "company": "Atos/Eviden", "headline": "Atos invests in UK secure infrastructure to capture growing public sector IT market", "summary": "Atos has established new UK-based data and AI infrastructure with military-grade security to grow its public sector business. The firm currently holds 37 live UK public sector contracts worth \u00a31.3bn and is expanding despite its parent group's financial restructuring in France.", "url": "https://www.computerweekly.com/news/366632825/Frances-Atos-eyes-UK-public-sector-with-investment-in-secure-UK-infrastructure", "sentiment": 0.3}, {"date": "2026-06-23", "company": "Fujitsu", "headline": "Post Office signs \u00a3492m contracts with Accenture & One View Commerce to replace Horizon, ejecting Fujitsu", "summary": "The UK Post Office has awarded \u00a3492m in contracts to replace Fujitsu's Horizon system, which led to over 900 wrongful convictions. Fujitsu will continue during a managed transition until March 2027, ending a 25-year, \u00a32.5bn+ relationship.", "url": "https://www.datacenterdynamics.com/en/news/fujitsu-finally-set-to-exit-uk-post-office-it-contract/", "sentiment": -0.55}];
const sentimentData = [{"company": "IBM", "score": 0.55, "articles": 4}, {"company": "Capgemini", "score": 0.825, "articles": 2}, {"company": "Deloitte", "score": 0.675, "articles": 2}, {"company": "CGI", "score": 0.58, "articles": 3}, {"company": "PA Consulting", "score": 0.283, "articles": 3}, {"company": "Capita", "score": -0.017, "articles": 3}, {"company": "PwC", "score": 0.2, "articles": 3}, {"company": "Atos/Eviden", "score": 0.15, "articles": 2}, {"company": "Fujitsu", "score": -0.55, "articles": 1}];

function getSentimentClass(score) {
  if (score >= 0.5) return 'sent-pos';
  if (score >= 0.1) return 'sent-neutral-pos';
  if (score >= -0.1) return 'sent-neutral';
  if (score >= -0.5) return 'sent-caution';
  return 'sent-neg';
}
function getSentimentLabel(score) {
  if (score >= 0.5) return '🟢 Positive';
  if (score >= 0.1) return '🟡 Neutral+';
  if (score >= -0.1) return '⚪ Neutral';
  if (score >= -0.5) return '🟠 Caution';
  return '🔴 Negative';
}
function getBarColor(score) {
  if (score >= 0.5) return '#3fb950';
  if (score >= 0.1) return '#d29922';
  if (score >= -0.1) return '#8b949e';
  if (score >= -0.5) return '#db6d28';
  return '#f85149';
}

// Build date list
const dateMap = {};
articles.forEach(a => {
  if (!dateMap[a.date]) dateMap[a.date] = 0;
  dateMap[a.date]++;
});
const dates = Object.keys(dateMap).sort().reverse();
const dateList = document.getElementById('date-list');
dates.forEach((d, i) => {
  const div = document.createElement('div');
  div.className = 'date-item' + (i === 0 ? ' active' : '');
  div.innerHTML = `<span class="date-label">${d}</span><span class="date-count">${dateMap[d]}</span>`;
  div.onclick = () => {
    document.querySelectorAll('.date-item').forEach(el => el.classList.remove('active'));
    div.classList.add('active');
    renderCards(currentFilter);
  };
  div.dataset.date = d;
  dateList.appendChild(div);
});

// Build company filter chips
const companies = [...new Set(articles.map(a => a.company))];
const filterBar = document.getElementById('filter-bar');
companies.forEach(c => {
  const chip = document.createElement('div');
  chip.className = 'chip';
  chip.dataset.filter = c;
  chip.textContent = c;
  chip.onclick = () => setFilter(c);
  filterBar.appendChild(chip);
});

let currentFilter = 'All';
function setFilter(f) {
  currentFilter = f;
  document.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c.dataset.filter === f));
  renderCards(f);
}

function renderCards(filter) {
  const container = document.getElementById('cards-container');
  container.innerHTML = '';
  const activeDateEl = document.querySelector('.date-item.active');
  const filtered = articles.filter(a => {
    const matchCompany = filter === 'All' || a.company === filter;
    return matchCompany;
  });
  if (filtered.length === 0) {
    container.innerHTML = '<p style="color:var(--text2); padding:20px;">No stories found.</p>';
    return;
  }
  filtered.forEach(a => {
    const card = document.createElement('div');
    card.className = 'card';
    const sentClass = getSentimentClass(a.sentiment);
    const sentLabel = getSentimentLabel(a.sentiment);
    card.innerHTML = `
      <div class="card-meta">
        <span class="company-tag">${a.company}</span>
        <span class="sentiment-tag ${sentClass}">${sentLabel}</span>
        <span class="card-date">📅 ${a.date}</span>
      </div>
      <h3><a href="${a.url}" target="_blank">${a.headline}</a></h3>
      <p>${a.summary}</p>
      <div class="card-footer"><a href="${a.url}" target="_blank">Read full article →</a></div>
    `;
    container.appendChild(card);
  });
}

// Sentiment panel
const panel = document.getElementById('sentiment-panel');
sentimentData.forEach(s => {
  const barWidth = Math.round(((s.score + 1) / 2) * 100);
  const color = getBarColor(s.score);
  const label = getSentimentLabel(s.score);
  panel.innerHTML += `
    <div class="sentiment-row">
      <div class="label"><span>${s.company}</span><span class="score">${s.score >= 0 ? '+' : ''}${s.score.toFixed(2)}</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:${barWidth}%; background:${color};"></div></div>
      <div style="font-size:11px; color:var(--text2); margin-top:2px;">${label} · ${s.articles} articles</div>
    </div>
  `;
});

// Initial render
renderCards('All');

// Chat widget
function toggleChat() {
  document.getElementById('chat-panel').classList.toggle('open');
}
function sendChat() {
  const msg = document.getElementById('chat-input').value.trim();
  if (!msg) return;
  document.getElementById('chat-response').textContent = '⏳ Sending...';
  fetch('https://hooks.tasklet.ai/watchtower', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({type: 'chat', message: msg})
  }).then(r => r.json()).then(d => {
    document.getElementById('chat-response').textContent = d.reply || 'Message sent!';
  }).catch(() => {
    document.getElementById('chat-response').textContent = '✅ Message sent to watchtower.';
  });
  document.getElementById('chat-input').value = '';
}
document.getElementById('chat-input').addEventListener('keydown', e => { if (e.key === 'Enter') sendChat(); });
</script>
</body>
</html>
