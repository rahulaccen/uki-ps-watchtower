d in the next 12 months.", "url": "https://uk.newsroom.ibm.com/2026-ibm-study-ai-investment-in-uki-is-set-to-surge", "sentiment": 0.35}, {"date": "2026-06-23", "company": "IBM", "headline": "IBM Marks 70 Years in Ireland with \u20ac11.5M Tech Donation to SETU Waterford", "summary": "IBM celebrated its 70th anniversary in Ireland by donating an \u20ac11.5 million technology system \u2014 including an IBM z17 mainframe \u2014 to South East Technological University (SETU) Waterford, with the Taoiseach in attendance.", "url": "https://uk.newsroom.ibm.com/IBM-celebrates-70-years-in-ireland", "sentiment": 0.65}, {"date": "2026-06-23", "company": "PA Consulting", "headline": "Jiten Kachhela Named President of PA Consulting as Firm Enters New Chapter Under Jacobs", "summary": "Jacobs has appointed Jiten Kachhela \u2014 a 20-year PA veteran and former Global Head of Digital & Data \u2014 as President of PA Consulting, effective immediately. He succeeds CEO Christian Norris, who led the firm through Jacobs' full acquisition of PA.", "url": "https://www.paconsulting.com/newsroom/jiten-kachhela-announced-as-president-of-pa-consulting-10-june-2026", "sentiment": 0.3}, {"date": "2026-06-23", "company": "PwC", "headline": "PwC Warns Record UK Borrowing of \u00a323.3bn in May Leaves Public Finances Exposed", "summary": "PwC UK economist Nabil Taleb has warned that May 2026's public sector net borrowing of \u00a323.3 billion \u2014 \u00a35.6 billion above OBR forecasts \u2014 leaves the UK government with little fiscal headroom.", "url": "https://www.pwc.co.uk/press-room/press-releases/research-commentary/2026/pwc-comments-on-public-sector-finance-data---june-2026.html", "sentiment": -0.15}, {"date": "2026-06-23", "company": "PwC", "headline": "PwC leads MCA Awards 2026 shortlist with 33 nominations as UK government consulting spend hits record \u00a33.7bn", "summary": "PwC has the highest representation on the 2026 Management Consulting Association Awards shortlist, with 33 projects and individuals recognised as finalists. New Tussell data shows UK government spending on consulting reached a record \u00a33.7 billion in 2024/25.", "url": "https://www.consultancy.uk/news/44186/government-consulting-spend-hits-37-billion", "sentiment": 0.35}, {"date": "2026-06-24", "company": "Fujitsu", "headline": "Fujitsu Still Collecting Government Contracts Despite Zero Contribution to Horizon Compensation", "summary": "An i Paper analysis spotlights that Fujitsu has not contributed a single penny to the \u00a32 billion Post Office Horizon compensation bill while continuing to hold UK government contracts through 'existing customer' exemptions to its own voluntary bidding pause.", "url": "https://inews.co.uk", "sentiment": -0.7}];
const datesList = [["2026-07-03", 3], ["2026-07-02", 4], ["2026-07-01", 3], ["2026-06-30", 1], ["2026-06-29", 1], ["2026-06-28", 1], ["2026-06-27", 2], ["2026-06-26", 3], ["2026-06-25", 2], ["2026-06-24", 1], ["2026-06-23", 15]];
const sentimentData = {"IBM": {"avg": 0.0, "cnt": 0}, "Capgemini": {"avg": 0.725, "cnt": 4}, "Deloitte": {"avg": 0.5, "cnt": 4}, "CGI": {"avg": 0.7, "cnt": 2}, "PA Consulting": {"avg": 0.683, "cnt": 3}, "Capita": {"avg": -0.55, "cnt": 8}, "PwC": {"avg": 0.0, "cnt": 0}, "Atos/Eviden": {"avg": 0.0, "cnt": 0}, "Fujitsu": {"avg": -0.467, "cnt": 3}};
const companies = ["IBM", "Capgemini", "Deloitte", "CGI", "PA Consulting", "Capita", "PwC", "Atos/Eviden", "Fujitsu"];

let activeDate = null;
let activeCompany = 'All';

const companyColors = {
  'IBM': ['#0043ce','#cce0ff'], 'Capgemini': ['#0070ad','#cce8ff'],
  'Deloitte': ['#006400','#c8ecc8'], 'CGI': ['#8b0000','#ffdada'],
  'PA Consulting': ['#5c3d99','#e8d8ff'], 'Capita': ['#c8581a','#ffe6d0'],
  'PwC': ['#c8001a','#ffd0d8'], 'Atos/Eviden': ['#005a8e','#cce4f4'],
  'Fujitsu': ['#cc0000','#ffd9d9']
};

function sentInfo(avg, cnt) {
  if(cnt===0) return {e:'⚪',l:'No data',c:'#8b949e',bg:'#21262d'};
  if(avg>=0.5) return {e:'🟢',l:'Positive',c:'#3fb950',bg:'#1c3a2a'};
  if(avg>=0.1) return {e:'🟡',l:'Neutral+',c:'#d29922',bg:'#2a2100'};
  if(avg>=-0.1) return {e:'⚪',l:'Neutral',c:'#8b949e',bg:'#21262d'};
  if(avg>=-0.5) return {e:'🟠',l:'Caution',c:'#f85149',bg:'#3a1c1c'};
  return {e:'🔴',l:'Negative',c:'#f85149',bg:'#3a1c1c'};
}

function cardSentColor(s) {
  if(s>=0.5) return '#3fb950';
  if(s>=0.1) return '#d29922';
  if(s>=-0.1) return '#8b949e';
  if(s>=-0.5) return '#f0883e';
  return '#f85149';
}

// Build sidebar dates
function buildSidebar() {
  const dl = document.getElementById('dates-list');
  dl.innerHTML = '<div class="date-item '+(activeDate===null?'active':'')+'" onclick="filterDate(null)">All dates <span class="date-badge">'+articles.length+'</span></div>';
  datesList.forEach(([d,cnt])=>{
    const label = d==='2026-07-06'?'Mon 6 Jul ⚠️':formatDate(d);
    dl.innerHTML += '<div class="date-item '+(activeDate===d?'active':'')+'" onclick="filterDate(''+d+'')">'+label+' <span class="date-badge">'+cnt+'</span></div>';
  });
}

function formatDate(d) {
  const days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const dt=new Date(d+'T12:00:00Z');
  return days[dt.getUTCDay()]+' '+dt.getUTCDate()+' '+months[dt.getUTCMonth()];
}

function buildSentimentPanel() {
  const p = document.getElementById('sentiment-panel');
  p.innerHTML = '';
  companies.forEach(c=>{
    const s=sentimentData[c];
    const info=sentInfo(s.avg,s.cnt);
    const pct=s.cnt===0?50:Math.round((s.avg+1)/2*100);
    const scoreStr=s.cnt===0?'N/A':(s.avg>=0?'+':'')+s.avg.toFixed(2);
    p.innerHTML+=`<div class="sent-row">
      <div class="sent-company"><span>${c}</span><span class="sent-score" style="color:${info.c}">${info.e} ${scoreStr}</span></div>
      <div class="sent-bar"><div class="sent-fill" style="width:${pct}%;background:${info.c}"></div></div>
      <div class="sent-label">${info.l} (${s.cnt} articles)</div>
    </div>`;
  });
}

function buildCards() {
  const area = document.getElementById('cards-area');
  let filtered = articles;
  if(activeDate) filtered = filtered.filter(a=>a.date===activeDate);
  if(activeCompany!=='All') filtered = filtered.filter(a=>a.company===activeCompany);
  
  area.innerHTML='';
  if(activeDate==='2026-07-06' || (activeDate===null && filtered.length===0)) {
    area.innerHTML='<div class="weekend-alert"><strong>⚠️ Weekend Gap — Mon 6 Jul 2026</strong><br><br>No fresh UK/Ireland public sector news published in the 24-hour window covering Sat–Sun 4–5 Jul. All 9 monitored companies: no qualifying articles. The <strong>Tuesday 7 Jul briefing</strong> is expected to carry fresh stories from today's UK business day.</div>';
    if(filtered.length>0) {} // shouldn't happen
  } else if(filtered.length===0) {
    area.innerHTML='<div class="no-data">No stories found for selected filters.</div>';
  } else {
    filtered.forEach(a=>{
      const [bg,fg]=companyColors[a.company]||['#333','#fff'];
      const sColor=cardSentColor(a.sentiment);
      const dotStyle=`background:${sColor}`;
      area.innerHTML+=`<div class="card">
        <div class="card-header">
          <div class="sent-dot" style="${dotStyle}"></div>
          <span class="company-tag" style="background:${bg}20;color:${bg}">${a.company}</span>
          <span class="date-tag">${formatDate(a.date)}</span>
        </div>
        <h3>${a.headline}</h3>
        <p>${a.summary}</p>
        <div class="card-footer">
          ${a.url?'<a href="'+a.url+'" target="_blank" rel="noopener">Read source →</a>':''}
          <span class="sent-badge" style="background:${sColor}20;color:${sColor}">${a.sentiment>=0?'+':''}${a.sentiment.toFixed(2)}</span>
        </div>
      </div>`;
    });
  }
}

function filterDate(d) {
  activeDate=d;
  buildSidebar();
  buildCards();
}

function filterCompany(c) {
  activeCompany=c;
  document.querySelectorAll('.chip').forEach(el=>{
    el.classList.toggle('active', el.textContent.replace(/[🇬🇧\s]/g,'').trim()===c||
      (c==='All'&&el.textContent==='All'));
  });
  buildCards();
}

function toggleChat() {
  const o=document.getElementById('chat-overlay');
  o.classList.toggle('open');
}

async function sendMsg() {
  const inp=document.getElementById('chat-input');
  const msg=inp.value.trim();
  if(!msg) return;
  const area=document.getElementById('chat-messages');
  area.innerHTML+=`<div class="msg user">${msg}</div>`;
  inp.value='';
  area.scrollTop=area.scrollHeight;
  
  // Post to webhook
  try {
    const resp=await fetch('https://tasklet.ai/webhook/uki-ps-watchtower',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({type:'chat',message:msg})
    });
    const data=await resp.json().catch(()=>({reply:'Thanks for your message — I'll look into that shortly.'}));
    area.innerHTML+=`<div class="msg bot">${data.reply||'Message received. Check back for updates.'}</div>`;
  } catch(e) {
    area.innerHTML+=`<div class="msg bot">Chat service unavailable. Please try again later.</div>`;
  }
  area.scrollTop=area.scrollHeight;
}

// Init
buildSidebar();
buildSentimentPanel();
buildCards();
</script>
</body>
</html>
